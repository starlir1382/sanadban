<!-- Scan Viewer: Full-Screen Phone Gallery Lightbox -->
<div class="scan-viewer-modal" x-show="showScanViewerModal" x-cloak
     @keydown.right.window="if (showScanViewerModal) prevScan()"
     @keydown.left.window="if (showScanViewerModal) nextScan()"
     @keydown.escape.window="if (showScanViewerModal) closeScanViewer()"
     style="position: fixed; inset: 0; z-index: 99999; background: #000; display: flex; flex-direction: column;">

    <!-- Slim Top Bar -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; height: 44px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); flex-shrink: 0;">
        <!-- Counter -->
        <span class="fa-num" style="color: #e2e8f0; font-size: 0.82rem; font-weight: 700;"
              x-show="getFilteredAttachments().length > 0"
              x-text="(activeScanIndex + 1) + ' / ' + getFilteredAttachments().length"></span>

        <!-- Toolbar: zoom, rotate, print, close -->
        <div style="display: flex; align-items: center; gap: 6px;">
            <button type="button" @click="zoomInScan()" title="بزرگ‌نمایی"
                    style="background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button type="button" @click="zoomOutScan()" title="کوچک‌نمایی"
                    style="background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button type="button" @click="resetScan()" title="بازنشانی زوم"
                    style="background: rgba(255,255,255,0.12); border: none; color: #e2e8f0; border-radius: 6px; padding: 0 8px; height: 32px; font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: monospace;"
                    x-text="Math.round(activeScan.zoom * 100) + '%'"></button>
            <button type="button" @click="rotateScan()" title="چرخش ۹۰ درجه"
                    style="background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            </button>
            <button type="button" @click="printActiveScan()" title="چاپ"
                    style="background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            </button>
            <button type="button" @click="closeScanViewer()"
                    style="background: #dc2626; border: none; color: #fff; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; font-weight: 700;">✕</button>
        </div>
    </div>

    <!-- Image Stage -->
    <div style="flex: 1; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;"
         @click.self="closeScanViewer()">

        <!-- Prev / Next floating buttons -->
        <template x-if="getFilteredAttachments().length > 1">
            <div>
                <button type="button" @click.stop="prevScan()"
                        style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(6px);">›</button>
                <button type="button" @click.stop="nextScan()"
                        style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(6px);">‹</button>
            </div>
        </template>

        <!-- Zoomable / rotatable content -->
        <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: auto;"
             :style="`transform: scale(${activeScan.zoom}) rotate(${activeScan.rotation}deg); transform-origin: center center;`">

            <!-- Real uploaded image -->
            <template x-if="activeScan.preview_url && !isPdfFile(activeScan) && !isHtmlDoc(activeScan)">
                <img :src="activeScan.preview_url"
                     style="max-width: 100%; max-height: calc(100vh - 44px); object-fit: contain; display: block; margin: auto;"
                     @error="$el.style.opacity='0.3'">
            </template>

            <!-- PDF / HTML: iframe embed -->
            <template x-if="activeScan.preview_url && (isPdfFile(activeScan) || isHtmlDoc(activeScan))">
                <iframe :src="activeScan.preview_url"
                        style="width: min(900px, 95vw); height: calc(100vh - 80px); border: none; border-radius: 6px; background: #fff;"></iframe>
            </template>

            <!-- No file uploaded: plain placeholder -->
            <template x-if="!activeScan.preview_url">
                <div style="text-align: center; color: #64748b; padding: 3rem;">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="1.5" style="margin: 0 auto 1rem;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <div style="font-size: 0.9rem; color: #94a3b8;">فایلی بارگذاری نشده است</div>
                </div>
            </template>
        </div>
    </div>
</div>
