<!-- Slim pipeline stepper. Uses the parent Alpine scope:
     currentStage, status, isLocked, isChief, userCanAction, getStage(), getStageGuidance(), scrollToActiveSection()
     Expects a parent scope with `tab` (defined in dossier_detail.html). -->
<style>
  .ps-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  }
  .ps-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .ps-num {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #2563eb;
    color: #fff;
    font-weight: 800;
    font-size: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ps-title {
    font-weight: 800;
    font-size: 1rem;
    color: #0f172a;
  }
  .ps-sub {
    font-size: 0.78rem;
    color: #64748b;
    margin-top: 2px;
  }
  .ps-chip {
    font-size: 0.7rem;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
    display: inline-block;
  }
  .ps-track {
    display: grid;
    grid-template-columns: 9fr 2fr 7fr 4fr;
    gap: 6px;
    margin-top: 0.9rem;
  }
  .ps-seg {
    font-size: 0.7rem;
    font-weight: 700;
    color: #64748b;
  }
  .ps-bar {
    height: 7px;
    border-radius: 99px;
    background: #e2e8f0;
    margin-top: 4px;
    overflow: hidden;
  }
  .ps-fill {
    height: 100%;
    background: #2563eb;
    transition: width 0.3s;
  }
  .ps-btn {
    padding: 0.5rem 1.1rem;
    font-size: 0.82rem;
    font-weight: 800;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .ps-btn:hover {
    background: #1d4ed8;
  }
</style>

<div class="ps-card">
  <div class="ps-row">
    <div style="display: flex; align-items: center; gap: 0.8rem">
      <div class="ps-num fa-num" x-text="currentStage"></div>
      <div>
        <div class="ps-title" x-text="getStage(currentStage).title"></div>
        <div class="ps-sub fa-num">
          <span x-text="'مرحله ' + currentStage + ' از ۲۱'"></span> ·
          <span x-text="'مسئول: ' + getStage(currentStage).role"></span>
        </div>
      </div>
    </div>

    <div
      style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap"
    >
      <!-- status -->
      <span
        class="ps-chip"
        style="background: #fee2e2; color: #b91c1c"
        x-show="status === 'RETURNED'"
        >برگشت‌خورده</span
      >
      <span
        class="ps-chip"
        style="background: #e0f2fe; color: #0369a1"
        x-show="status === 'IN_PROGRESS' && !isLocked"
        >در جریان</span
      >
      <span
        class="ps-chip"
        style="background: #dcfce7; color: #15803d"
        x-show="isLocked || status === 'COMPLETED'"
        >مختومه ✓</span
      >
      <!-- access -->
      <span
        class="ps-chip"
        style="background: #fef3c7; color: #92400e"
        x-show="isChief"
        >دسترسی کامل</span
      >
      <span
        class="ps-chip"
        style="background: #ecfdf5; color: #065f46"
        x-show="!isChief && userCanAction"
        >اقدام مجاز</span
      >
      <span
        class="ps-chip"
        style="background: #f1f5f9; color: #475569"
        x-show="!userCanAction"
        >فقط مشاهده</span
      >

      <button
        type="button"
        class="ps-btn"
        @click="tab = 'form'; $nextTick(() => scrollToActiveSection(getStageGuidance(currentStage).targetSection))"
      >
        <span
          x-text="'رفتن به فرم: ' + getStageGuidance(currentStage).actionTitle"
        ></span>
      </button>
    </div>
  </div>

  <!-- 4-phase progress track -->
  <div class="ps-track fa-num">
    <div>
      <div class="ps-seg">۱ · کارگزاری (۰–۸)</div>
      <div class="ps-bar">
        <div
          class="ps-fill"
          :style="'width:' + Math.min(100, Math.max(0, currentStage / 9 * 100)) + '%'"
        ></div>
      </div>
    </div>
    <div>
      <div class="ps-seg">۲ · پرونده (۹–۱۰)</div>
      <div class="ps-bar">
        <div
          class="ps-fill"
          :style="'width:' + Math.min(100, Math.max(0, (currentStage - 9) / 2 * 100)) + '%'"
        ></div>
      </div>
    </div>
    <div>
      <div class="ps-seg">۳ · ممیزی (۱۱–۱۷)</div>
      <div class="ps-bar">
        <div
          class="ps-fill"
          :style="'width:' + Math.min(100, Math.max(0, (currentStage - 11) / 7 * 100)) + '%'"
        ></div>
      </div>
    </div>
    <div>
      <div class="ps-seg">۴ · محضر (۱۸–۲۱)</div>
      <div class="ps-bar">
        <div
          class="ps-fill"
          :style="'width:' + (isLocked ? 100 : Math.min(100, Math.max(0, (currentStage - 18) / 4 * 100))) + '%'"
        ></div>
      </div>
    </div>
  </div>
</div>
