<!-- Pipeline Stepper (21-Step Compact Bar with Expandable Details) -->
<style>
  /* =====================================================================
     STEPPER (21-Stage Compact Bar)
     ===================================================================== */
  .ps-card {
    background: #fff;
    border: 1px solid #e8edf3;
    border-radius: 16px;
    padding: 0.85rem 1.15rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.04);
    position: relative;
    overflow: hidden;
  }
  .ps-card::before {
    content: "";
    position: absolute;
    inset: 0 0 0 auto;
    width: 4px;
    background: linear-gradient(180deg, #6366f1, #4f46e5);
  }

  .ps-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
    margin-bottom: 0.65rem;
  }
  .ps-header-info {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .ps-stage-badge {
    font-size: 0.76rem;
    font-weight: 800;
    padding: 0.2rem 0.7rem;
    border-radius: 999px;
    background: #eef2ff;
    color: #3730a3;
    border: 1px solid #c7d2fe;
    white-space: nowrap;
  }
  .ps-title-compact {
    font-weight: 800;
    font-size: 0.95rem;
    color: #0f172a;
  }
  .ps-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.3rem 0.8rem;
    border-radius: 8px;
    border: 1px solid #d5dde8;
    background: #f8fafc;
    font-size: 0.76rem;
    font-weight: 700;
    color: #334155;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .ps-toggle-btn:hover {
    background: #eef2ff;
    color: #4338ca;
    border-color: #c7d2fe;
  }

  /* 21 Steps Horizontal Bar */
  .ps-chain {
    display: flex;
    align-items: center;
    gap: 3px;
    width: 100%;
    padding: 3px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .ps-chain::-webkit-scrollbar { display: none; }

  .ps-step {
    flex: 1;
    min-width: 28px;
    height: 30px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.74rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.18s ease;
    border: 1.5px solid transparent;
    user-select: none;
    position: relative;
  }
  .ps-step.done {
    background: #f0fdf4;
    color: #15803d;
    border-color: #bbf7d0;
  }
  .ps-step.done:hover {
    background: #dcfce7;
    transform: translateY(-1px);
  }
  .ps-step.current {
    background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
    color: #ffffff;
    border-color: #312e81;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.28), 0 3px 8px rgba(79, 70, 229, 0.35);
    transform: scale(1.06);
    z-index: 2;
  }
  .ps-step.todo {
    background: #f8fafc;
    color: #94a3b8;
    border-color: #e2e8f0;
  }
  .ps-step.todo:hover {
    background: #f1f5f9;
    color: #475569;
  }

  /* Expandable details drawer */
  .ps-drawer {
    margin-top: 0.85rem;
    padding-top: 0.85rem;
    border-top: 1px dashed #e2e8f0;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }
  .ps-drawer-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .ps-role { font-size: 0.78rem; color: #64748b; }
  .ps-role strong { color: #334155; }
  .ps-guidance {
    display: flex; gap: 0.5rem; align-items: flex-start;
    font-size: 0.82rem; color: #334155; line-height: 1.8;
    background: #f8fafc; border: 1px solid #e8edf3; border-radius: 10px; padding: 0.5rem 0.8rem;
    width: 100%;
  }
  .ps-guidance b { color: #4338ca; white-space: nowrap; }
  .ps-state { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  .ps-chip {
    font-size: 0.72rem; font-weight: 800; padding: 3px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px;
  }

  /* 4 macro phases */
  .ps-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-top: 0.4rem; }
  .ps-phase { min-width: 0; }
  .ps-phase-label { display: flex; justify-content: space-between; gap: 0.4rem; font-size: 0.7rem; font-weight: 700; color: #64748b; margin-bottom: 5px; }
  .ps-phase-label span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-phase.done .ps-phase-label { color: #047857; }
  .ps-phase.now .ps-phase-label { color: #3730a3; }
  .ps-bar { height: 7px; border-radius: 99px; background: #e8edf3; overflow: hidden; }
  .ps-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6366f1, #4f46e5); transition: width 0.4s ease; }
  .ps-phase.done .ps-fill { background: linear-gradient(90deg, #34d399, #059669); }
  @media (max-width: 720px) { .ps-track { grid-template-columns: 1fr 1fr; } }

  /* =====================================================================
     SHARED THEME for form_sections / audit / scans (visual-only overrides)
     ===================================================================== */
  .form-sections-wrapper { display: flex; flex-direction: column; gap: 1rem; }
  .form-sections-wrapper .form-card {
    background: #fff;
    border: 1px solid #e8edf3 !important;
    border-radius: 16px !important;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.04) !important;
    overflow: hidden;
    margin-bottom: 0 !important;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .form-sections-wrapper .form-card.section-active-highlight {
    border-color: #818cf8 !important;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.16), 0 8px 24px rgba(79, 70, 229, 0.12) !important;
  }
  .form-sections-wrapper .form-section-header {
    background: #fafbfd;
    border-bottom: 1px solid #eef1f6;
    padding: 0.85rem 1.2rem;
  }
  .form-sections-wrapper .section-title { color: #0f172a; font-weight: 800; font-size: 0.92rem; }
  .form-sections-wrapper .section-title > svg { color: #4f46e5; }
  .form-sections-wrapper .form-section-body { padding: 1.2rem; }
  .form-sections-wrapper .section-stage-badge {
    border-radius: 999px; font-size: 0.72rem; font-weight: 700; padding: 0.22rem 0.75rem;
  }
  .form-sections-wrapper .section-stage-badge.editable { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
  .form-sections-wrapper .section-stage-badge.locked { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

  .form-sections-wrapper .field-label { font-size: 0.78rem; font-weight: 700; color: #475569; }
  .form-sections-wrapper .helper-badge { border-radius: 999px; font-size: 0.66rem; }
  .form-sections-wrapper .input-control {
    border: 1.5px solid #d5dde8;
    border-radius: 10px;
    background: #fff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .form-sections-wrapper .input-control:focus {
    border-color: #6366f1; outline: none; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
  }
  .form-sections-wrapper .input-control[readonly],
  .form-sections-wrapper .input-control:disabled { background: #f6f8fb; color: #475569; }
  .form-sections-wrapper .field-locked .input-control { background: #f6f8fb; }

  .form-sections-wrapper .confirmation-toggle-card {
    border-radius: 12px; border: 1.5px solid #e2e8f0; background: #fafbfd; transition: all 0.2s ease;
  }
  .form-sections-wrapper .confirmation-toggle-card.confirmed { background: #f0fdf4; border-color: #86efac; }
  .form-sections-wrapper .check-table { width: 100%; border-collapse: separate; border-spacing: 0; }
  .form-sections-wrapper .check-table thead th {
    background: #fafbfd; color: #64748b; font-size: 0.74rem; font-weight: 800; padding: 0.65rem 0.7rem; border-bottom: 1px solid #eef1f6;
  }
  .form-sections-wrapper .check-table tbody td { padding: 0.55rem 0.7rem; border-bottom: 1px solid #f1f4f8; }
  .form-sections-wrapper .btn-header-docs {
    display: inline-flex; align-items: center; gap: 4px; padding: 0.25rem 0.7rem; border-radius: 999px;
    background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; font-size: 0.72rem; font-weight: 700; cursor: pointer;
  }
  .form-sections-wrapper .btn-header-docs:hover { background: #e0e7ff; }

  /* Scans album + excel bar polish */
  .attachments-card { border-radius: 16px !important; border-color: #e8edf3 !important; }
  .stage-tab-pill { border-radius: 999px !important; }
</style>

<div class="ps-card">
  <!-- Top bar: Compact Stage Summary + Expand Button -->
  <div class="ps-header-bar">
    <div class="ps-header-info fa-num">
      <span class="ps-stage-badge">مرحله <span x-text="currentStage"></span> از ۲۱</span>
      <span class="ps-title-compact" x-text="getStage(currentStage).title"></span>
      <span class="ps-chip" style="background: #e0f2fe; color: #0369a1" x-show="status === 'IN_PROGRESS' && !isLocked" x-cloak>● در جریان</span>
      <span class="ps-chip" style="background: #fee2e2; color: #b91c1c" x-show="status === 'RETURNED'" x-cloak>↩ برگشت‌خورده</span>
      <span class="ps-chip" style="background: #dcfce7; color: #15803d" x-show="isLocked || status === 'COMPLETED'" x-cloak>✓ مختومه</span>
    </div>

    <button type="button" class="ps-toggle-btn" @click="stepperExpanded = !stepperExpanded">
      <span x-text="stepperExpanded ? 'بستن جزئیات ▲' : 'جزئیات بیشتر ▼'"></span>
    </button>
  </div>

  <!-- 21-Step Chain Bar (Always visible) -->
  <div class="ps-chain fa-num" role="navigation" aria-label="مراحل گردش کار ۲۱ مرحله‌ای">
    <template x-for="stg in stages" :key="'chain-' + stg.id">
      <div
        class="ps-step"
        :class="stg.id === currentStage ? 'current' : (stg.id < currentStage ? 'done' : 'todo')"
        :title="'مرحله ' + stg.id + ': ' + stg.title + ' (' + stg.role + ')'"
        @click="tab = 'form'; $nextTick(() => scrollToActiveSection(getStageGuidance(stg.id).targetSection))"
      >
        <span x-text="stg.id"></span>
      </div>
    </template>
  </div>

  <!-- Expandable Details Drawer (Shows instructions, role, and 4 macro phases) -->
  <div class="ps-drawer" x-show="stepperExpanded" x-cloak x-transition>
    <div class="ps-drawer-row">
      <div class="ps-role">
        <span>مسئول اقدام: </span>
        <strong x-text="getStage(currentStage).role"></strong>
      </div>

      <div class="ps-state">
        <span class="ps-chip" style="background: #fef3c7; color: #92400e" x-show="isChief" x-cloak>اختیارات تام رئیس مسکن</span>
        <span class="ps-chip" style="background: #ecfdf5; color: #065f46" x-show="!isChief && userCanAction && !isLocked" x-cloak>اقدام مجاز</span>
        <span class="ps-chip" style="background: #f1f5f9; color: #475569" x-show="!userCanAction && !isLocked" x-cloak>👁 فقط مشاهده</span>
        <span class="ps-chip" style="background: #f1f5f9; color: #475569" x-show="isLocked" x-cloak>🔒 قفل نهایی</span>
      </div>
    </div>

    <div class="ps-guidance">
      <b>دستور اقدام:</b>
      <span x-text="getStageGuidance(currentStage).instruction || 'اطلاعات و مستندات این مرحله را بررسی، در صورت نیاز اصلاح و سپس تایید فرمایید.'"></span>
    </div>

    <!-- 4 macro phases track -->
    <div class="ps-track fa-num">
      <div class="ps-phase" :class="{done: currentStage > 8 || isLocked, now: currentStage <= 8}">
        <div class="ps-phase-label"><span>فاز ۱ · کارگزاری (۱–۸)</span></div>
        <div class="ps-bar"><div class="ps-fill" :style="'width:' + (isLocked ? 100 : Math.min(100, Math.max(0, currentStage / 8 * 100))) + '%'"></div></div>
      </div>
      <div class="ps-phase" :class="{done: currentStage > 10 || isLocked, now: currentStage > 8 && currentStage <= 10}">
        <div class="ps-phase-label"><span>فاز ۲ · اداره کل (۹–۱۰)</span></div>
        <div class="ps-bar"><div class="ps-fill" :style="'width:' + (isLocked ? 100 : Math.min(100, Math.max(0, (currentStage - 8) / 2 * 100))) + '%'"></div></div>
      </div>
      <div class="ps-phase" :class="{done: currentStage > 15 || isLocked, now: currentStage > 10 && currentStage <= 15}">
        <div class="ps-phase-label"><span>فاز ۳ · فنی و حقوقی (۱۱–۱۵)</span></div>
        <div class="ps-bar"><div class="ps-fill" :style="'width:' + (isLocked ? 100 : Math.min(100, Math.max(0, (currentStage - 10) / 5 * 100))) + '%'"></div></div>
      </div>
      <div class="ps-phase" :class="{done: isLocked, now: currentStage > 15}">
        <div class="ps-phase-label"><span>فاز ۴ · تسویه و بایگانی (۱۶–۲۱)</span></div>
        <div class="ps-bar"><div class="ps-fill" :style="'width:' + (isLocked ? 100 : Math.min(100, Math.max(0, (currentStage - 15) / 6 * 100))) + '%'"></div></div>
      </div>
    </div>
  </div>
</div>
