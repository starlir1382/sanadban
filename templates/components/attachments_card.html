<!-- Enterprise Scanned Documents Table & Attachments Manager -->
<div class="attachments-card" style="background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.03);">
    
    <!-- Panel Header -->
    <div class="panel-header" style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;">
        <div class="panel-title" style="display: flex; align-items: center; gap: 0.6rem; font-weight: 800; font-size: 1rem; color: #0f2744;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
            <span>مدارک و اسناد اسکن‌شده پرونده</span>
            <span class="fa-num" style="background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; font-size: 0.75rem; padding: 0.15rem 0.55rem; border-radius: 12px; font-weight: 700;" x-text="attachments.length + ' سند'"></span>
        </div>

        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span class="lock-pill strict-rule" style="background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; font-size: 0.75rem; padding: 0.25rem 0.65rem; border-radius: 6px; display: flex; align-items: center; gap: 0.35rem;" title="مدارک بارگذاری شده توسط سایر مراحل قابل حذف نمی‌باشد">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                <span>عدم امکان حذف فرامرحله‌ای</span>
            </span>

            <button type="button" class="btn btn-primary" style="padding: 0.45rem 1rem; font-size: 0.82rem; font-weight: 700;" @click="openUploadScanModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span>+ بارگذاری / اسکن سند جدید</span>
            </button>
        </div>
    </div>

    <!-- Empty State when no scans uploaded yet -->
    <div x-show="attachments.length === 0" style="text-align: center; padding: 2.75rem 1.5rem; background: #ffffff;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem auto; color: #94a3b8;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
        </div>
        <div style="font-weight: 800; font-size: 0.95rem; color: #1e293b;">هنوز سندی برای این پرونده بارگذاری یا اسکن نشده است</div>
        <div style="font-size: 0.8rem; color: #64748b; margin-top: 0.35rem; margin-bottom: 1.25rem;">جهت افزودن اسناد هویتی، دفترچه اقساط، چک یا اسناد ثبتی روی دکمه زیر کلیک کنید.</div>
        <button type="button" class="btn btn-outline" style="padding: 0.5rem 1.25rem; font-size: 0.85rem;" @click="openUploadScanModal()">
            <span>بارگذاری اولین مدرک</span>
        </button>
    </div>

    <!-- Clean Enterprise Attachments Data Table -->
    <div x-show="attachments.length > 0" style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: right;">
            <thead>
                <tr style="background: #f8fafc; border-bottom: 1.5px solid #e2e8f0; color: #475569; font-weight: 700; font-size: 0.78rem;">
                    <th style="padding: 0.75rem 1.25rem; width: 60px; text-align: center;">ردیف</th>
                    <th style="padding: 0.75rem 1rem;">نوع و عنوان کامل سند</th>
                    <th style="padding: 0.75rem 1rem; width: 140px;">مرحله بارگذاری</th>
                    <th style="padding: 0.75rem 1rem; width: 170px;">اقدام‌کننده</th>
                    <th style="padding: 0.75rem 1rem; width: 170px;">تاریخ و هش امنیتی</th>
                    <th style="padding: 0.75rem 1.25rem; width: 140px; text-align: center;">عملیات</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="(item, idx) in attachments" :key="item.id">
                    <tr style="border-bottom: 1px solid #f1f5f9; transition: background 0.15s;" 
                        @mouseenter="$el.style.background = '#f8fafc'" 
                        @mouseleave="$el.style.background = 'transparent'">
                        
                        <!-- Index -->
                        <td style="padding: 0.85rem 1.25rem; text-align: center; color: #94a3b8; font-weight: bold;" class="fa-num" x-text="idx + 1"></td>

                        <!-- Title & Type -->
                        <td style="padding: 0.85rem 1rem;">
                            <div style="display: flex; align-items: center; gap: 0.65rem;">
                                <div style="width: 34px; height: 34px; border-radius: 8px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;">
                                    <span x-show="item.type === 'NATIONAL_ID' || item.type === 'SPOUSE_ID'">🪪</span>
                                    <span x-show="item.type === 'UNIT_SELECTION'">📑</span>
                                    <span x-show="item.type === 'BANK_BOOKLET' || item.type === 'BANK_LETTER'">🏦</span>
                                    <span x-show="item.type === 'TITLE_DEED'">📜</span>
                                    <span x-show="item.type === 'LOAN_CHECK' || item.type === 'PREP_CHECK'">💳</span>
                                    <span x-show="!['NATIONAL_ID','SPOUSE_ID','UNIT_SELECTION','BANK_BOOKLET','BANK_LETTER','TITLE_DEED','LOAN_CHECK','PREP_CHECK'].includes(item.type)">📄</span>
                                </div>
                                <div>
                                    <div style="font-weight: 800; color: #0f172a; cursor: pointer;" @click="openScanViewer(item)" x-text="item.title"></div>
                                    <div style="font-size: 0.72rem; color: #64748b;" x-text="item.fileName || 'scan_document.pdf'"></div>
                                </div>
                            </div>
                        </td>

                        <!-- Stage -->
                        <td style="padding: 0.85rem 1rem;">
                            <span class="role-pill fa-num" style="font-size: 0.72rem; padding: 0.2rem 0.55rem;"
                                  :class="item.stage <= 4 || [6,9,10,11,12,20,21].includes(item.stage) ? 'brokerage' : 'directorate'"
                                  x-text="'مرحله ' + item.stage"></span>
                        </td>

                        <!-- Uploader -->
                        <td style="padding: 0.85rem 1rem; color: #334155;">
                            <div style="font-weight: 600; font-size: 0.82rem;" x-text="item.uploader || 'کارشناس سامانه'"></div>
                        </td>

                        <!-- Date & SHA256 -->
                        <td style="padding: 0.85rem 1rem;">
                            <div class="fa-num" style="font-size: 0.78rem; color: #475569;" x-text="item.uploadDate"></div>
                            <div style="font-size: 0.68rem; color: #059669; font-weight: 600; font-family: monospace; direction: ltr; text-align: right;" 
                                 x-text="(item.sha256 || 'SHA256: 7f83b165...').substring(0, 16) + '...'"></div>
                        </td>

                        <!-- Actions -->
                        <td style="padding: 0.85rem 1.25rem; text-align: center;">
                            <div style="display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
                                <!-- View Lightbox -->
                                <button type="button" class="btn btn-outline" style="padding: 0.35rem 0.65rem; font-size: 0.75rem; border-color: #cbd5e1;" 
                                        @click="openScanViewer(item)" title="مشاهده اسکن با کیفیت کامل">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                    <span>مشاهده</span>
                                </button>

                                <!-- Stage-Gated Delete -->
                                <button type="button" x-show="currentStage === item.stage" 
                                        @click="attachments = attachments.filter(a => a.id !== item.id); triggerToast('مدرک با موفقیت حذف گردید.', 'warning');"
                                        style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; border-radius: 6px; padding: 0.35rem 0.5rem; cursor: pointer;" 
                                        title="حذف مدرک (فقط در مرحله جاری مجاز است)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>

                                <span x-show="currentStage !== item.stage" title="سند در مراحل قبلی ثبت شده و طبق ضوابط قابل حذف نیست" style="color: #94a3b8; font-size: 0.72rem; display: flex; align-items: center; gap: 2px;">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                                </span>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

</div>
