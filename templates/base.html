{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سامانه سندبان | مدیریت پرونده و گردش کار نهضت ملی مسکن{% endblock %}</title>

    <!-- Persian Typography (Vazirmatn) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

    <!-- SanadBan Enterprise Design System -->
    <link rel="stylesheet" href="{% static 'css/sanadban.css' %}?v=3.0">
    {% block extra_css %}{% endblock %}

    <!-- Alpine.js & HTMX Core Scripts -->
    <script defer src="https://unpkg.com/alpinejs@3.14.0/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    
    <!-- Application Logic -->
    <script src="{% static 'js/sanadban.js' %}?v=3.0"></script>
</head>
<body x-data="sanadbanApp">

    <!-- Unified Administrative Navigation Bar -->
    {% include 'layouts/navbar.html' %}

    <!-- Main Content Slot -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Unified Footer -->
    {% include 'layouts/footer.html' %}

    <!-- Floating System Toast / Notification -->
    <div x-show="showToast" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 transform translate-y-4"
         x-transition:enter-end="opacity-100 transform translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 transform translate-y-0"
         x-transition:leave-end="opacity-0 transform translate-y-4"
         style="position: fixed; bottom: 5.5rem; right: 2rem; z-index: 99; min-width: 320px; max-width: 450px;"
         :style="toastType === 'success' ? 'background: #065f46; color: #fff;' : (toastType === 'error' ? 'background: #991b1b; color: #fff;' : 'background: #92400e; color: #fff;')"
         class="shadow-xl rounded-lg p-4 flex items-center justify-between border border-white/20">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <svg x-show="toastType === 'success'" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
            <svg x-show="toastType === 'error'" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="15" y1="9" x2="9" y2="15"></line>
                <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <svg x-show="toastType === 'warning'" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <span x-text="toastMessage" style="font-size: 0.88rem; font-weight: 500;"></span>
        </div>
        <button @click="showToast = false" style="background: transparent; border: none; color: #fff; cursor: pointer; padding: 0 4px; font-size: 1.1rem;">✕</button>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
