<style>
  .dl {
    --c-bg: #f6f8fb;
    --c-card: #ffffff;
    --c-line: #e8edf3;
    --c-line-strong: #d5dde8;
    --c-text: #0f172a;
    --c-muted: #64748b;
    --c-soft: #94a3b8;
    --c-primary: #4f46e5;
    --c-primary-soft: #eef2ff;
    --c-primary-line: #c7d2fe;
    --c-green: #059669;
    --c-green-soft: #ecfdf5;
    --c-amber: #d97706;
    --c-amber-soft: #fffbeb;
    --c-red: #dc2626;
    --c-red-soft: #fef2f2;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.04);
    color: var(--c-text);
    padding-bottom: 1.5rem;
    font-feature-settings: "ss01" 1;
    -webkit-font-feature-settings: "ss01" 1;
    font-variant-numeric: tabular-nums;
  }
  .dl * { box-sizing: border-box; }

  /* ---------- Header ---------- */
  .dl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    border-radius: var(--radius);
    background: var(--c-card);
    border: 1px solid var(--c-line);
    box-shadow: var(--shadow);
    color: var(--c-text);
  }
  .dl-header > * { position: relative; z-index: 1; }
  .dl-chips { display: flex; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
  .dl-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.22rem 0.7rem;
    border-radius: 999px;
    font-size: 0.74rem;
    font-weight: 700;
    background: var(--c-primary-soft);
    border: 1px solid var(--c-primary-line);
    color: var(--c-primary);
  }
  .dl-title { margin: 0 0 0.3rem; font-size: 1.3rem; font-weight: 800; line-height: 1.4; color: var(--c-text); }
  .dl-sub { margin: 0; font-size: 0.85rem; color: var(--c-muted); line-height: 1.7; max-width: 760px; }
  .dl-header-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .dl-hbtn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    min-height: 44px;
    padding: 0.55rem 1.1rem;
    border-radius: 10px;
    font-size: 0.84rem;
    font-weight: 700;
    text-decoration: none;
    border: 1px solid var(--c-line);
    background: var(--c-bg);
    color: var(--c-text);
    touch-action: manipulation;
    user-select: none;
    transition: background 150ms ease-out, border-color 150ms ease-out, transform 150ms ease-out;
  }
  .dl-hbtn:active { transform: scale(0.97); }
  .dl-hbtn.solid {
    background: var(--c-primary);
    color: #fff;
    border-color: var(--c-primary);
  }

  /* ---------- Cards ---------- */
  .dl-card {
    background: var(--c-card);
    border: 1px solid var(--c-line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 1rem;
  }

  /* ---------- Stage track ---------- */
  .dl-track { padding: 1rem 1.2rem; }
  .dl-track-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .dl-track-title { font-size: 0.9rem; font-weight: 800; display: flex; align-items: center; gap: 0.5rem; }
  .dl-track-hint { font-size: 0.76rem; color: var(--c-muted); }
  .dl-pills {
    display: flex;
    gap: 0.45rem;
    overflow-x: auto;
    padding-bottom: 0.35rem;
    scrollbar-width: thin;
    scrollbar-color: var(--c-line-strong) transparent;
  }
  .dl-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    white-space: nowrap;
    text-decoration: none;
    padding: 0.42rem 0.85rem;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 600;
    background: #fff;
    color: #475569;
    border: 1px solid var(--c-line-strong);
    transition: all 0.15s ease;
  }
  .dl-pill:hover { border-color: var(--c-primary); color: var(--c-primary); background: var(--c-primary-soft); }
  .dl-pill.has { background: var(--c-amber-soft); color: #92400e; border-color: #fde68a; }
  .dl-pill.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
  .dl-pill-count {
    font-size: 0.7rem;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: 999px;
    background: #e2e8f0;
    color: #475569;
  }
  .dl-pill.has .dl-pill-count { background: var(--c-amber); color: #fff; }
  .dl-pill.active .dl-pill-count { background: rgba(255, 255, 255, 0.25); color: #fff; }

  /* ---------- Toolbar ---------- */
  .dl-toolbar { padding: 1rem 1.25rem; }
  .dl-form { display: flex; flex-direction: column; gap: 0.85rem; width: 100%; }
  
  .dl-toolbar-search-row {
    display: flex;
    gap: 0.65rem;
    align-items: center;
    flex-wrap: wrap;
    width: 100%;
  }

  .dl-toolbar-actions-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding-top: 0.85rem;
    border-top: 1px solid var(--c-line);
    width: 100%;
  }

  .dl-actions-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .dl-actions-label {
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--c-muted);
    margin-inline-end: 0.35rem;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }

  .dl-search { position: relative; flex: 1; min-width: 280px; }
  .dl-search svg.ic { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--c-soft); }
  .dl-search input {
    width: 100%;
    min-height: 44px;
    padding: 0.65rem 2.6rem 0.65rem 2.4rem;
    border: 1px solid var(--c-line-strong);
    border-radius: 10px;
    font-size: 16px !important;
    background: var(--c-bg);
    color: var(--c-text);
    outline: none;
    transition: border-color 150ms ease-out, box-shadow 150ms ease-out, background 150ms ease-out;
  }
  .dl-search input:focus { border-color: var(--c-primary); background: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12); }
  .dl-search .clear {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: #e2e8f0;
    color: #475569;
    font-size: 0.7rem;
    cursor: pointer;
  }
  .dl-select {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    min-height: 44px;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--c-line-strong);
    border-radius: 10px;
    background: var(--c-card);
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--c-muted);
  }
  .dl-select select { border: none; background: transparent; font-weight: 700; font-size: 16px !important; color: var(--c-primary); outline: none; cursor: pointer; }
  .dl-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.45rem;
    min-height: 42px;
    padding: 0.5rem 1rem;
    border-radius: 10px;
    font-size: 0.84rem;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    border: 1px solid transparent;
    touch-action: manipulation;
    user-select: none;
    transition: transform 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
  }
  .dl-btn:active { transform: scale(0.97); }
  .dl-btn.primary { background: var(--c-primary); color: #fff; box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28); }
  .dl-btn.primary:hover { background: #4338ca; }
  .dl-btn.ghost { background: #fff; color: #334155; border-color: var(--c-line-strong); }
  .dl-btn.ghost:hover { background: var(--c-bg); }
  .dl-btn.green { background: var(--c-green-soft); color: #047857; border-color: #a7f3d0; }
  .dl-btn.green:hover { background: #d1fae5; }
  .dl-btn.indigo { background: var(--c-primary-soft); color: #4338ca; border-color: var(--c-primary-line); }
  .dl-btn.indigo:hover { background: #e0e7ff; }
  .dl-btn.red { background: #fff; color: var(--c-red); border-color: #fecaca; }
  .dl-counter {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.95rem;
    min-height: 42px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 800;
    white-space: nowrap;
    background: var(--c-primary-soft);
    color: #3730a3;
    border: 1px solid var(--c-primary-line);
  }
  .dl-hints { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; font-size: 0.74rem; color: var(--c-muted); }
  .dl-hints .tag { background: #f1f5f9; padding: 0.18rem 0.55rem; border-radius: 6px; font-weight: 600; }

  /* ---------- Table ---------- */
  .dl-table-card { overflow: hidden; }
  .dl-table-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.6rem;
    padding: 1rem 1.3rem;
    border-bottom: 1px solid var(--c-line);
  }
  .dl-table-title { display: flex; align-items: center; gap: 0.55rem; font-size: 0.98rem; font-weight: 800; }
  .dl-table-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .dl-badge-count { font-size: 0.76rem; font-weight: 800; color: #3730a3; background: var(--c-primary-soft); padding: 0.25rem 0.75rem; border-radius: 999px; }
  .dl-badge-filter { font-size: 0.76rem; font-weight: 700; color: #92400e; background: var(--c-amber-soft); border: 1px solid #fde68a; padding: 0.25rem 0.75rem; border-radius: 999px; }
  .dl-scroll { overflow-x: auto; width: 100%; -webkit-overflow-scrolling: touch; }
  .dl-table { width: 100%; min-width: 900px; border-collapse: separate; border-spacing: 0; direction: rtl; text-align: right; font-size: 0.84rem; }
  .dl-table thead th {
    padding: 0.75rem 0.65rem;
    font-size: 0.74rem;
    font-weight: 800;
    color: var(--c-muted);
    background: #fafbfd;
    border-bottom: 1px solid var(--c-line);
    white-space: nowrap;
    text-align: right;
  }
  .dl-table tbody td { padding: 0.6rem 0.65rem; vertical-align: middle; border-bottom: 1px solid #f1f4f8; }
  .dl-table tbody tr.dossier-row { transition: background 0.12s ease; }
  .dl-table tbody tr.dossier-row:hover { background: #f8faff; }
  .dl-table tbody tr.dossier-row:last-child td { border-bottom: none; }
  .t-center { text-align: center !important; }

  .dl-id {
    display: inline-block;
    direction: ltr;
    font-weight: 800;
    font-size: 0.8rem;
    color: #3730a3;
    background: var(--c-primary-soft);
    border: 1px solid var(--c-primary-line);
    padding: 3px 9px;
    border-radius: 8px;
  }
  .dl-person { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
  .dl-avatar {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.95rem;
    color: #4338ca;
    background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
  }
  .dl-person-info { min-width: 0; }
  .dl-name { font-weight: 800; font-size: 0.86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; line-height: 1.35; }
  .dl-subline { font-size: 0.74rem; color: var(--c-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; line-height: 1.3; }
  .dl-subline-sep { color: #64748b; margin-right: 4px; }
  .dl-bank-name { color: #059669; font-weight: 700; margin-right: 4px; }
  .dl-nid { direction: ltr; display: inline-block; letter-spacing: 0.4px; }
  .dl-project { font-weight: 700; font-size: 0.84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; line-height: 1.35; }

  /* Stage cell */
  .dl-stage {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 0.12rem;
    text-align: right;
  }
  .dl-stage-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.32rem;
    padding: 0.22rem 0.65rem;
    border-radius: 8px;
    font-size: 0.78rem;
    font-weight: 700;
    border: 1px solid transparent;
    line-height: 1.4;
    white-space: nowrap;
  }
  .dl-stage-pill .lbl { font-weight: 600; opacity: 0.85; }
  .dl-stage-pill .no  { font-weight: 800; }
  .dl-stage-pill.brokerage  { background: var(--c-primary-soft); color: #4338ca; border-color: var(--c-primary-line); }
  .dl-stage-pill.directorate { background: var(--c-green-soft);  color: #047857; border-color: #a7f3d0; }
  .dl-stage-pill.done       { background: #dcfce7; color: #166534; border-color: #86efac; }
  .dl-stage-title {
    font-size: 0.67rem;
    font-weight: 500;
    color: var(--c-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 190px;
    line-height: 1.25;
    text-align: right;
    display: block;
  }
  .dl-date {
    display: inline-flex;
    align-items: center;
    gap: 0.28rem;
    font-size: 0.72rem;
    color: var(--c-muted);
    font-weight: 600;
    white-space: nowrap;
  }
  .dl-date svg { color: var(--c-soft); flex-shrink: 0; }
  .dl-stage-meta { display: flex; align-items: center; justify-content: flex-start; gap: 0.35rem; flex-wrap: wrap; }
  .dl-status { display: inline-flex; align-items: center; gap: 3px; font-size: 0.67rem; font-weight: 800; padding: 1px 6px; border-radius: 6px; white-space: nowrap; border: 1px solid transparent; }
  .dl-status.red    { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
  .dl-status.orange { background: #ffedd5; color: #c2410c; border-color: #fed7aa; }
  .dl-status.green  { background: #dcfce7; color: #15803d; border-color: #86efac; }
  .dl-status.ret    { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; cursor: help; }

  .dl-role { font-size: 0.8rem; font-weight: 700; line-height: 1.4; color: #1e293b; white-space: normal; word-break: normal; overflow-wrap: break-word; }
  .dl-unit { display: inline-block; margin-top: 4px; font-size: 0.66rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; }
  .dl-unit.brokerage { background: var(--c-primary-soft); color: #4338ca; border-color: var(--c-primary-line); }
  .dl-unit.directorate { background: var(--c-green-soft); color: #065f46; border-color: #a7f3d0; }
  .dl-equity { font-weight: 800; color: #047857; font-size: 0.9rem; white-space: nowrap; }
  .dl-equity small { font-size: 0.7rem; font-weight: 700; color: var(--c-green); margin-right: 3px; }

  .dl-actions { display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem; white-space: nowrap; }
  .dl-open {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.42rem 0.75rem;
    border-radius: 9px;
    font-size: 0.78rem;
    font-weight: 800;
    text-decoration: none;
    color: #fff;
    background: var(--c-primary);
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(79, 70, 229, 0.22);
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .dl-open:hover { background: #4338ca; transform: translateY(-1px); }
  .dl-icon-btn {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #475569;
    background: #fff;
    border: 1px solid var(--c-line-strong);
    text-decoration: none;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .dl-icon-btn:hover { background: var(--c-primary-soft); color: var(--c-primary); border-color: var(--c-primary-line); }

  /* Empty states */
  .dl-empty { text-align: center; padding: 3.5rem 1.5rem; color: var(--c-muted); }
  .dl-empty-ic {
    width: 68px;
    height: 68px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    background: var(--c-primary-soft);
    color: var(--c-primary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dl-empty h3 { margin: 0 0 0.4rem; font-size: 1.1rem; font-weight: 800; color: var(--c-text); }
  .dl-empty p { margin: 0 auto; font-size: 0.86rem; line-height: 1.9; max-width: 520px; }
  .dl-empty .cta { margin-top: 1.1rem; }

  /* Pagination */
  .dl-pager {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
    padding: 0.9rem 1.3rem;
    border-top: 1px solid var(--c-line);
    background: #fafbfd;
  }
  .dl-pager-info { font-size: 0.8rem; color: var(--c-muted); font-weight: 600; }
  .dl-pager-info strong { color: var(--c-text); }
  .dl-pager-nav { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }
  .dl-pg {
    min-width: 34px;
    height: 34px;
    padding: 0 0.7rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 0.8rem;
    font-weight: 700;
    text-decoration: none;
    color: #334155;
    background: #fff;
    border: 1px solid var(--c-line-strong);
    transition: all 0.15s ease;
  }
  .dl-pg:hover { background: var(--c-primary-soft); border-color: var(--c-primary-line); color: var(--c-primary); }
  .dl-pg.current { background: var(--c-primary); color: #fff; border-color: var(--c-primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.3); }
  .dl-pg.gap { border: none; background: none; color: var(--c-soft); }

  @media (max-width: 900px) {
    .dl-stages {
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
  }

  @media (max-width: 768px) {
    .dl-header {
      padding: 1.1rem;
      flex-direction: column;
      align-items: stretch;
      gap: 0.85rem;
    }
    .dl-title { font-size: 1.15rem; }
    .dl-header-actions {
      width: 100%;
      flex-direction: column;
      gap: 0.5rem;
    }
    .dl-hbtn {
      width: 100%;
      justify-content: center;
    }
    .dl-toolbar {
      padding: 0.85rem;
    }
    .dl-form {
      flex-direction: column;
      align-items: stretch;
      gap: 0.6rem;
    }
    .dl-search {
      min-width: 100%;
      width: 100%;
    }
    .dl-select {
      width: 100%;
      justify-content: space-between;
    }
    .dl-select select {
      flex: 1;
    }
    .dl-btn {
      width: 100%;
      justify-content: center;
    }
    .dl-counter {
      width: 100%;
      justify-content: center;
    }
    .dl-table-head {
      flex-direction: column;
      align-items: stretch;
      gap: 0.6rem;
    }
    .dl-table-meta {
      justify-content: space-between;
    }
    .dl-pager {
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
    }
    .dl-pager-nav {
      justify-content: center;
      flex-wrap: wrap;
    }
  }

  @media (max-width: 480px) {
    .dl-stages {
      grid-template-columns: repeat(2, 1fr);
      gap: 0.35rem;
    }
    .dl-scard {
      padding: 0.45rem 0.55rem;
    }
    .dl-scard .title {
      font-size: 0.75rem;
    }
    .dl-header {
      padding: 0.9rem 0.85rem;
      border-radius: 12px;
    }
    .dl-chips {
      gap: 0.3rem;
    }
    .dl-chip {
      font-size: 0.68rem;
      padding: 0.15rem 0.55rem;
    }
  }

  /* ---------- Admin slim action row ---------- */
  .dl-admin-actions { display: flex; gap: 0.6rem; justify-content: flex-start; flex-wrap: wrap; margin-bottom: 0.9rem; }

  /* ---------- Stage cards grid ---------- */
  .dl-stages {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 0.5rem;
  }
  .dl-scard {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding: 0.55rem 0.7rem 0.6rem;
    border-radius: 12px;
    border: 1px solid var(--c-line-strong);
    background: #fff;
    text-decoration: none;
    color: var(--c-text);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
