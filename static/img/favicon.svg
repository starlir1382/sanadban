  <!-- Text lines -->
  <g stroke="#1e3a8a" stroke-width="3.5" stroke-linecap="round">
    <line x1="23" y1="40" x2="41" y2="40"/>
    <line x1="23" y1="48" x2="33" y2="48" stroke="#93c5fd"/>
  </g>
</svg>
